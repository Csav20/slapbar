; ╔══════════════════════════════════════════════════════════════╗
; ║        SlapMac ESP32 — PlatformIO (alternativa a Arduino IDE)║
; ║  Instala PlatformIO en VSCode y abre esta carpeta           ║
; ║  Botón "→ Upload" en la barra inferior para grabar          ║
; ╚══════════════════════════════════════════════════════════════╝

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Puerto serie — déjalo en auto o pon el tuyo: /dev/cu.usbserial-XXXX
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX

monitor_speed = 115200

; Librerías necesarias
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

; Opciones de compilación
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os

upload_speed  = 921600
monitor_flags = --raw
